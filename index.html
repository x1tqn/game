const ICON={start:'🏁',key:'🔑',rail:'🚆',rest:'☕',culture:'🎭',family:'👨‍👩‍👧',dmz:'🪖',pmj:'🤝',sports:'⚽',tension:'⚠️'};
function buildBoard(){built=true;const b=$('#board');b.innerHTML='';
  B.T.forEach(t=>{const[r,c]=pos(t.i),d=document.createElement('div');d.className='tile'+(t.type!=='city'?' sp':'');d.id='t'+t.i;if(t.type==='city')d.style.background=TINT[t.price];d.style.gridArea=`${r}/${c}`;
   d.innerHTML=`${t.type==='city'?`<div class="band" style="background:${BAND[t.price]}"></div>`:''}<span class="no">${t.i+1}</span><div class="nm">${ICON[t.type]||''}${esc(t.name)}${t.tag?`<span class="tag ${t.tag==='북'?'n':'s'}">${t.tag}</span>`:''}</div><div class="ty">${t.type==='city'?'지역':TYL[t.type]}</div>${t.price?`<div class="pr">${t.price}만</div>`:''}<div class="bld"></div><div class="ow"></div><div class="tk"></div>`;
   d.onclick=()=>tileClick(t.i);b.appendChild(d)});
  const mid=document.createElement('div');mid.id='mid';mid.innerHTML='<div class="stamp">STAMP TOUR</div><div class="big">한반도<br>한 바퀴</div><div id="midinfo" style="margin-top:8px;font-size:14px"></div>';b.appendChild(mid)}
function renderTop(){const t=S.tension,mood=t<=1?'🕊 평화로운 분위기 (교류 보상 +50%)':t<=3?'기본 상태':t===4?'⚠️ 긴장 고조 (특별칸 보상 -50%)':'🚨 긴급 상황';
  const m=Math.floor(Math.max(0,S.left)/60),s=Math.max(0,S.left)%60,left=S.left;
  let w='';if(S.status==='playing'){if(left<=60)w='🚨 마지막 1분!';else if(left<=300)w='⏰ 게임 종료까지 5분!';
   [[300,'⏰ 게임 종료까지 5분!'],[60,'🚨 마지막 1분!']].forEach(([k,msg])=>{if(left<=k&&!warned[k]){warned[k]=1;toast(msg);SFX.play('alarm')}if(left>k)warned[k]=0})}
  $('#top').innerHTML=`<b>🗺 한반도 한 바퀴</b><span>🕊 한반도 긴장도 <b>${t}/5</b> <small>${mood}</small></span><span>${w} ⏱ <b>${m}:${String(s).padStart(2,'0')}</b></span><span><button class="sub" onclick="SFX.toggle();render()" style="padding:2px 10px">${SFX.muted()?'🔇 소리 켜기':'🔊'}</button> <button class="sub" onclick="SFX.bgm();render()" style="padding:2px 10px">${SFX.isBgm()?'🎵 배경음 끄기':'🎵 배경음'}</button> <button class="sub" onclick="askLeave()" style="padding:2px 10px">🏠 나가기</button></span>${S.paused?'<span style="background:#f4a300;color:#000;padding:2px 10px;border-radius:8px">⏸ 일시정지</span>':''}`}
function renderLeft(){const own=i=>S.own.map((o,k)=>o&&o.o===i?k:-1).filter(k=>k>=0);
  $('#left').innerHTML='<b>👥 플레이어</b><div class="pcards">'+S.players.map(p=>{const ts=own(p.id),st=S.status==='playing'&&cur().id===p.id;
   return `<div class="pcard ${st?'cur':''} ${p.alive?'':'dead'}"><div class="pn">${dc(p)} <b>${esc(p.name)}</b>${st?' 👈 차례':''}${p.online===false?' 📴':''}</div><div class="cash">💰 ${fmt(p.cash)}</div>
   <div class="chips">${p.alive?(ts.length?ts.map(k=>{const t=B.T[k],o=S.own[k];return `<span class="chip" style="background:${TINT[t.price]}">${t.name}${['','🏠','🏘️','🏢','🏯'][o.lv]}${o.x2?'×2':''}</span>`}).join(''):'<span class="none">지역 없음</span>'):'<span class="none">파산</span>'}</div>
   <div class="st">${p.skip?'🧊 이번 차례 쉼 ':''}${p.tradeBan?'📵 거래 불가 ':''}${p.freeRail?'🎟 무료 이동권 '+p.freeRail:''}</div></div>`}).join('')+'</div>'}
function renderRight(){const c=cur(),m=me();let txt;
  if(S.status==='ended')txt='🏆 게임이 끝났습니다.';else if(isMe())txt=`${dc(c)} ${esc(c.name)}의 차례입니다.${S.phase==='roll'?'<br>주사위를 굴려 주세요!':''}`;
  else txt=`${dc(c)} ${esc(c.name)}이(가) ${S.phase==='roll'?'주사위를 굴리고 있습니다.':S.pending&&S.pending.type==='buy'?'구매를 고민하고 있습니다.':'행동하고 있습니다.'}`;
  const mine=isMe()&&S.status==='playing'&&!S.paused&&m.alive;
  const tr=S.trade;
  $('#right').innerHTML=`<div id="turn">${txt}</div><div class="panel" style="text-align:center"><span class="die" id="d1">${S.dice.a}</span><span class="die" id="d2">${S.dice.b}</span>
  <div><button id="rollb" ${mine&&S.phase==='roll'?'':'disabled'} onclick="act('roll')" style="width:100%;margin-top:6px">🎲 주사위 굴리기</button></div>
  <div><button ${mine&&S.phase==='after'?'':'disabled'} onclick="act('endTurn')" class="sub" style="width:100%;margin-top:6px">턴 종료 ▶</button></div></div>
  <div class="panel" style="font-size:13px">💡 지도 위 <b>내 지역을 클릭</b>하면 건설·거래할 수 있어요. 지역을 클릭하면 통행료표도 볼 수 있어요.${S.pending&&S.pending.type==='choose'&&mine?'<br><b style="color:#c0392b">👉 이동(선택)할 지역을 보드에서 클릭하세요!</b>':''}</div>
  ${tr&&tr.from===ME.pid?`<div class="panel">🤝 거래 제안 대기 중...<br><button class="sub" onclick="act('tradeCancel')">취소</button></div>`:''}`;
  if(S.dice.seq!==lastSeq){const first=lastSeq===0;lastSeq=S.dice.seq;if(!first){rolling=1;SFX.play('dice');['#d1','#d2'].forEach(s=>$(s).classList.add('roll'));const iv=setInterval(()=>{$('#d1').textContent=1+Math.floor(Math.random()*6);$('#d2').textContent=1+Math.floor(Math.random()*6)},80);setTimeout(()=>{clearInterval(iv);rolling=0;render()},650)}}
  if(rolling){['#d1','#d2'].forEach(s=>$(s)&&$(s).classList.add('roll'))}}
function renderBoard(){setTimeout(()=>{LV.init=1},0);B.T.forEach(t=>{const d=$('#t'+t.i),o=S.own[t.i],ow=d.querySelector('.ow');
   {const bl=d.querySelector('.bld'),lv=o?o.lv:0,pl=LV[t.i]||0;bl.textContent=['','🏠','🏘️','🏢','🏯'][lv];bl.classList.toggle('land',lv===4);d.classList.toggle('built',lv>0);
    if(lv>pl&&LV.init){bl.classList.remove('pop');void bl.offsetWidth;bl.classList.add('pop')}LV[t.i]=lv}
   if(o){const p=S.players.find(x=>x.id===o.o);ow.style.background=p?p.color:'#999';ow.textContent=`${p?esc(p.name):''} ${o.x2?'×2':''}`}else{ow.style.background='none';ow.textContent=''}
   const c=S.status==='playing'&&cur()&&cur().pos===t.i;d.classList.toggle('cur',c);
   d.classList.toggle('pick',!!(S.pending&&S.pending.type==='choose'&&isMe()&&(S.pending.mode==='double'?o&&o.o===ME.pid:true)))});
  const c=cur(),t=c&&c.pos>=0?B.T[c.pos]:null;$('#midinfo').innerHTML=S.trade?`🤝 거래 제안: ${esc(S.players.find(p=>p.id===S.trade.from).name)} → ${esc(S.players.find(p=>p.id===S.trade.to).name)} (${B.T[S.trade.tile].name}, ${S.trade.price}만 원)`:t?`현재 위치: <b>${t.name}</b>`:''}
function syncTokens(){S.players.forEach(p=>{if(shown[p.id]===undefined||p.pos<0){shown[p.id]=p.pos}else if(shown[p.id]!==p.pos&&!anim[p.id])step(p.id)});drawTokens()}
function step(id){anim[id]=1;const go=()=>{if(rolling){setTimeout(go,100);return}const p=S&&S.players.find(x=>x.id===id);if(!p||p.pos<0||shown[id]===p.pos){anim[id]=0;drawTokens();if(!Object.values(anim).some(Boolean))renderModal();return}
  if((p.pos-shown[id]+40)%40>14)shown[id]=p.pos;else shown[id]=(shown[id]+1)%40;drawTokens(id);SFX.play('step');setTimeout(go,150)};go()}
function drawTokens(hopId){const b=$('#board');if(!b||!S)return;
  document.querySelectorAll('.pawn').forEach(e=>{if(!S.players.some(p=>'pw'+p.id===e.id&&p.alive))e.remove()});
  S.players.forEach(p=>{const at=shown[p.id];let e=$('#pw'+p.id);if(!p.alive||at===undefined||at<0)return;
   const t=$('#t'+at);if(!t)return;if(!e){e=document.createElement('div');e.id='pw'+p.id;e.className='pawn';b.appendChild(e)}
   const same=S.players.filter(q=>q.alive&&shown[q.id]===at),k=same.findIndex(q=>q.id===p.id),sz=t.offsetWidth*.34,fs=parseFloat(getComputedStyle(t).fontSize);
   e.style.background=p.color;e.textContent=p.name.slice(0,1);e.style.width=e.style.height=sz+'px';e.style.fontSize=sz*.55+'px';
   e.style.left=(t.offsetLeft+t.offsetWidth*.06+(k%3)*sz*.95)+'px';e.style.top=(t.offsetTop+t.offsetHeight-sz-fs*1.8-Math.floor(k/3)*sz*.95)+'px';
   if(hopId===p.id){e.classList.remove('hop');void e.offsetWidth;e.classList.add('hop')}});}
window.addEventListener('resize',()=>{if(S&&built)drawTokens()});
function lastMsg(){const m=S.log[S.log.length-1];if(m)$('#midinfo').innerHTML+=`<div class="lastmsg">${esc(m.m)}</div>`}
function renderLog(){const l=$('#logp');const atBottom=l.scrollTop+l.clientHeight>=l.scrollHeight-30;l.innerHTML='<b>📜 게임 로그</b>'+S.log.map(x=>`<div>${esc(x.m)}</div>`).join('');if(atBottom)l.scrollTop=l.scrollHeight}
function modal(html,cls=''){const m=$('#modal');m.classList.remove('hide');m.innerHTML=`<div class="mbox ${cls}">${html}</div>`}
const closeModal=()=>{$('#modal').classList.add('hide');$('#modal').innerHTML='';modalKey=''};let modalKey='';
function renderModal(){if(!S||S.status==='lobby')return;
  const moving=Object.values(anim).some(Boolean)||rolling;let key,fn;const pd=S.pending,m=me();
  if(S.status==='ended'){if(modalKey==='tile-pw')return;key='end'+m.id+(m.reflected?1:0)+JSON.stringify(S.results);if(modalKey===key)return;modalKey=key;return endModal()}
  if(moving)return;
  if(S.paused){key='paused';if(modalKey!==key){modalKey=key;modal('<h2>⏸ 일시정지</h2><p>교사가 게임을 잠시 멈췄어요.</p>')}return}
  const tr=S.trade;
  if(tr&&tr.to===ME.pid){key='trade'+JSON.stringify(tr);if(modalKey===key)return;modalKey=key;const f=S.players.find(p=>p.id===tr.from);return modal(`<h2>🤝 거래 제안</h2><p><b>${esc(f.name)}</b>이(가) <b>${B.T[tr.tile].name}</b>을(를)<br><b>${fmt(tr.price)}</b>에 팔겠다고 제안했어요.<br><small>내 돈: ${fmt(m.cash)}</small></p><div class="row"><button onclick="act('tradeAccept')">수락</button><button class="sub" onclick="act('tradeReject')">거절</button></div>`)}
  if(pd&&pd.type==='card'){key='card'+(S.log.length?S.log[S.log.length-1].at:0);if(modalKey===key)return;modalKey=key;const ok=isMe();
    return modal(`<div style="font-size:70px">${pd.icon}</div><h2>${pd.title}</h2><p>"${pd.msg}"</p>${pd.lines.map(l=>`<div style="font-weight:800;font-size:18px">${l}</div>`).join('')}<div style="margin:10px 0">🕊 긴장도 ${pd.from}/5 → <b>${pd.to}/5</b></div>${ok?'<button onclick="act(\'ack\')">확인</button>':'<small>카드 확인 중...</small>'}`,'card '+pd.kind)}
  if(pd&&pd.type==='buy'&&isMe()){key='buy'+pd.tile;if(modalKey===key)return;modalKey=key;const t=B.T[pd.tile];
    return modal(`<h2>${t.name} <span class="tag ${t.tag==='북'?'n':'s'}">${t.tag}</span></h2><p>구매가: <b>${fmt(t.price)}</b> · 기본 통행료 ${t.tl[0]}만 원</p><p style="background:#fff;padding:10px;border-radius:10px">${t.info}</p><div class="row"><button onclick="act('buy')">구매하기</button><button class="sub" onclick="act('decline')">구매하지 않기</button></div>`)}
  if(pd&&pd.type==='rail'&&isMe()){key='rail'+(S.log.length?S.log[S.log.length-1].at:0);if(modalKey===key)return;modalKey=key;
    return modal(`<h2>🚆 남북 철도</h2><p>어떻게 할까요?</p><div class="row" style="flex-direction:column"><button onclick="act('rail',{choice:'pay'})">${me().freeRail?'무료 이동권 사용하고 이동':'100만 원 내고 원하는 지역으로 이동'}</button><button class="sub" onclick="act('rail',{choice:'ticket'})">무료 이동권 획득 (다음 철도 이용 때 사용)</button></div>`)}
  if(pd&&pd.type==='choose'&&isMe()){key='choose'+pd.mode+(S.log.length?S.log[S.log.length-1].at:0);if(modalKey!==key){modalKey=key;toast(pd.mode==='double'?'통행료를 2배로 만들 내 지역을 클릭하세요':'이동할 지역을 클릭하세요')}$('#modal').classList.add('hide');return}

function tileClick(i){if(!S||S.status!=='playing')return;const pd=S.pending;

  const t=B.T[i],o=S.own[i];const owner=o&&S.players.find(p=>p.id===o.o);let h=`<h2>${ICON[t.type]||''} ${t.name} <small>#${i+1}</small></h2>`;

   h+=`<p>${t.price}만 원 · ${t.tag==='북'?'북한':'남한'} 지역<br><small>${t.info}</small></p><table class="tbl"><tr><th>단계</th><th>건설비</th><th>통행료</th></tr>${['기본','건물1','건물2','건물3','랜드마크'].map((n,k)=>`<tr ${o&&o.lv===k?'style="background:#fff3c4"':''}><td>${n}</td><td>${k?t.bc[k-1]+'만':'-'}</td><td>${t.tl[k]}만</td></tr>`).join('')}</table><p>소유자: ${owner?dc(owner)+esc(owner.name):'없음'}</p>`;
   const m=me();

     h+=`<div class="row"><button ${can?'':'disabled'} onclick="act('build',{tile:${i}}).then(closeModal)">${o.lv>=4?'최대 단계':'🏗 건설 ('+t.bc[o.lv]+'만 원)'}</button></div>
     <hr><b>거래 제안</b><select id="trTo">${S.players.filter(p=>p.alive&&p.id!==ME.pid).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input id="trP" type="number" min="0" placeholder="판매 가격 (만 원)" style="margin-top:6px"><div class="row"><button onclick="act('tradeOffer',{tile:${i},to:$('#trTo').value,price:$('#trP').value}).then(j=>{if(!j.error)closeModal()})">제안하기</button></div>`}}
  h+=`<div class="row"><button class="sub" onclick="closeModal()">닫기</button></div>`;modalKey='tile'+i;modal(h)}
function endModal(){const R=S.results,mx=Math.max(...R.map(r=>r.tiles)),m=me(),med=['🥇','🥈','🥉'];

  <div class="row"><button onclick="askPw('새 게임','교사 비밀번호를 입력하면 이 방이 새 게임으로 초기화돼요.',resetLocal)">🔄 새 게임 (교사용)</button><button class="sub" onclick="askPw('방 비우기','교사 비밀번호를 입력하면 이 방이 초기화돼요.',finishLocal)">처음으로 (방 비우기)</button></div>`)}
